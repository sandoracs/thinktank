name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ruff + pyright + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Project + dev group (ruff, pyright, pytest). Interpreter is pinned to
      # 3.12 via .python-version to match the design and the lockfile.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Pyright (strict type-check)
        run: uv run pyright

      - name: Pytest (unit + integration + web)
        run: uv run pytest -q
