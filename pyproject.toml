[project]
name = "thinktank"
version = "0.1.0"
description = "Multi-party debate system: AI agents and humans talk around a virtual table."
readme = "README.md"
license = { text = "MIT or Commercial (see LICENSE and COMMERCIAL-LICENSE.md)" }
requires-python = ">=3.12"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # schemas / config
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # storage
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "sqlite-vec>=0.1.6",
    # LLM
    "litellm>=1.48",
    "tenacity>=8.5",
    # logging
    "structlog>=24.4",
    # templating (UI later)
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    # config / template loading
    "pyyaml>=6.0",
    # remote agents (M7)
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local multilingual embeddings (heavy: pulls torch). Keep base install lean.
embeddings = ["sentence-transformers>=2.7"]

[project.scripts]
thinktank = "thinktank.cli:main"

# ---------------------------------------------------------------------------
# Plugin entry points. Built-ins are registered through the same mechanism as
# external plugins.
# ---------------------------------------------------------------------------
[project.entry-points."thinktank.turn_strategies"]
round_robin = "thinktank.strategies.round_robin:RoundRobin"
hand_raise = "thinktank.strategies.hand_raise:HandRaisePriority"
bidding = "thinktank.strategies.bidding:Bidding"

[project.entry-points."thinktank.participants"]
llm = "thinktank.participants.ai_agent:AIAgent"
remote = "thinktank.participants.remote:RemoteAgent"

[project.entry-points."thinktank.drift_policies"]
locked = "thinktank.persona.policies:LockedPolicy"
bounded = "thinktank.persona.policies:BoundedPolicy"
approved = "thinktank.persona.policies:ApprovedPolicy"
free = "thinktank.persona.policies:FreePolicy"

[project.entry-points."thinktank.embedding_providers"]
fake = "thinktank.memory.embeddings:FakeEmbeddingProvider"
litellm = "thinktank.memory.embeddings:LiteLLMEmbeddingProvider"

# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.414",
]

[tool.uv]
package = true

[tool.uv.pip]
python-version = "3.12"

# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thinktank"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S",
    "ANN", "RET", "PT", "PL",
]
ignore = [
    "ANN101", "ANN102", "S101",  # self/cls annotations, assert
    "PLR0913", "PLR0904", "PLR0915", "PLR0912",  # too many args/methods/statements/branches (design prescribes)
    "PLR2004", "PLR0911",  # magic values / too many returns (schemas)
    "ANN401",  # Any for JSON payloads and LLM kwargs
    "PLC0415",  # lazy imports of litellm (avoid import cost at startup)
    "PLR0917",  # ABC arity (MemoryBackend)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915", "ANN001", "ANN201", "ANN202", "S105", "S106"]
"src/thinktank/storage/tables.py" = ["PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["thinktank"]

# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportMissingTypeStubs = false
# litellm / aiosqlite / PyYAML ship partial or dynamic stubs; their "unknown"
# inference is inherent to the libraries, not a defect in our code.
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
extraPaths = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: real LLM API calls, skipped by default (run with -m live)",
]
addopts = "-ra"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore:.*starlette.testclient.*:UserWarning",
    "ignore::Warning:starlette.testclient",
]

[tool.coverage.run]
source = ["thinktank"]
