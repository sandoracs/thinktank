<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Roundtable</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/">Roundtable</a>
    <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Irányítópult</a>
    <a href="/sessions/new" class="{{ 'active' if active == 'builder' else '' }}">Új session</a>
    <a href="/agents" class="{{ 'active' if active == 'agents' else '' }}">Agent-könyvtár</a>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
