<div class="msg kind-{{ message.kind }}">
  <div class="msg-head">
    <span class="speaker">{{ speaker }}</span>
    <span class="chip chip-{{ message.kind }}">{{ message.kind }}</span>
    <span class="seq">#{{ event.seq }}</span>
  </div>
  <div class="msg-body">{{ message.content }}</div>
</div>
